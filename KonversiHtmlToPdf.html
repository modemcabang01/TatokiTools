<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konverter File HTML ke PDF (Sempurna & Anti-Terpotong)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* Styling Kertas A4 untuk Preview */
    .a4-page {
      width: 210mm;
      min-height: 297mm;
      padding: 12mm 10mm;
      margin: auto;
      background: white;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      box-sizing: border-box;
    }

    /* Rules Khusus Pemotongan Halaman (Page Break Avoid) */
    #pdf-preview h1, 
    #pdf-preview h2, 
    #pdf-preview h3, 
    #pdf-preview tr, 
    #pdf-preview table, 
    #pdf-preview ul, 
    #pdf-preview ol,
    #pdf-preview .box-warning, 
    #pdf-preview .box-recommendation,
    #pdf-preview .page-break-avoid {
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }

    /* Paksa Page Break Manual jika file HTML memiliki class .page-break */
    #pdf-preview .page-break {
      break-before: page !important;
      page-break-before: always !important;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

  <!-- Header & Toolbar -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <h1 class="text-xl font-bold flex items-center gap-2">
        📄 Converter File HTML &rarr; PDF
      </h1>
      
      <div class="flex items-center gap-3">
        <!-- Input File Tersembunyi -->
        <input type="file" id="file-selector" accept=".html, .htm" class="hidden" onchange="handleFileSelect(event)">
        
        <!-- Tombol Open File -->
        <button onclick="document.getElementById('file-selector').click()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2 border border-indigo-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z" />
          </svg>
          📂 Buka File HTML
        </button>

        <!-- Tombol Download PDF -->
        <button id="btn-download" onclick="downloadPDF()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-5 py-2 rounded-lg shadow transition flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          Download PDF
        </button>
      </div>
    </div>
  </header>

  <!-- Container Utama -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6 my-2">
    
    <!-- Sidebar Informasi File & Kode (3 Kolom) -->
    <section class="lg:col-span-4 flex flex-col gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Informasi File Terbuka</h2>
        <div id="file-info" class="text-sm font-medium text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-200 flex items-center justify-between">
          <span class="truncate">Belum ada file dibuka</span>
          <span class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded">None</span>
        </div>
      </div>

      <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
        <div class="bg-slate-50 p-3 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
          Kode HTML Source
        </div>
        <textarea id="html-source" class="w-full flex-1 p-3 font-mono text-xs bg-slate-900 text-emerald-400 focus:outline-none resize-none leading-relaxed" spellcheck="false" placeholder="Kode HTML dari file yang Anda buka akan muncul di sini..." oninput="updatePreviewFromText()"></textarea>
      </div>
    </section>

    <!-- Area Live Preview Kertas A4 (8 Kolom) -->
    <section class="lg:col-span-8 bg-slate-200 rounded-xl shadow-inner border border-slate-300 p-4 overflow-auto flex flex-col items-center min-h-[600px]" id="drop-zone" ondragover="handleDragOver(event)" onmouseleave="handleDragLeave(event)" ondrop="handleDrop(event)">
      
      <div id="upload-prompt" class="my-auto text-center p-8 border-2 border-dashed border-slate-400 rounded-xl bg-slate-50/50 max-w-md">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-indigo-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        <p class="font-semibold text-slate-700 mb-1">Klik "Buka File HTML" atau Drag & Drop file ke sini</p>
        <p class="text-xs text-slate-500">Mendukung format file .html dan .htm</p>
      </div>

      <!-- Kertas Pratinjau A4 -->
      <div id="pdf-preview" class="a4-page hidden"></div>
    </section>

  </main>

  <!-- Script Logic -->
  <script>
    let currentFileName = 'dokumen_hasil.pdf';

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        loadFile(file);
      }
    }

    function handleDragOver(e) {
      e.preventDefault();
      document.getElementById('drop-zone').classList.add('bg-indigo-50', 'border-indigo-400');
    }

    function handleDragLeave(e) {
      document.getElementById('drop-zone').classList.remove('bg-indigo-50', 'border-indigo-400');
    }

    function handleDrop(e) {
      e.preventDefault();
      document.getElementById('drop-zone').classList.remove('bg-indigo-50', 'border-indigo-400');
      const file = e.dataTransfer.files[0];
      if (file && (file.name.endsWith('.html') || file.name.endsWith('.htm'))) {
        loadFile(file);
      } else {
        alert('Harap masukkan file berformat .html atau .htm');
      }
    }

    function loadFile(file) {
      currentFileName = file.name.replace(/\.[^/.]+$/, "") + ".pdf";
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        document.getElementById('html-source').value = content;
        
        const preview = document.getElementById('pdf-preview');
        preview.innerHTML = content;
        
        preview.classList.remove('hidden');
        document.getElementById('upload-prompt').classList.add('hidden');
        
        document.getElementById('file-info').innerHTML = `
          <span class="truncate font-semibold text-indigo-600">${file.name}</span>
          <span class="text-xs bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded">Loaded</span>
        `;
      };
      reader.readAsText(file);
    }

    function updatePreviewFromText() {
      const content = document.getElementById('html-source').value;
      const preview = document.getElementById('pdf-preview');
      preview.innerHTML = content;
      if (content.trim() !== '') {
        preview.classList.remove('hidden');
        document.getElementById('upload-prompt').classList.add('hidden');
      }
    }

    function downloadPDF() {
      const element = document.getElementById('pdf-preview');
      
      if (element.classList.contains('hidden') || element.innerHTML.trim() === '') {
        alert('Buka file HTML terlebih dahulu sebelum mengunduh PDF.');
        return;
      }

      const btn = document.getElementById('btn-download');
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Memproses PDF...';
      btn.disabled = true;

      // KONFIGURASI PRESISI PDF (Anti-Terpotong & Margin Pas)
      const opt = {
        margin:       [12, 10, 12, 10], // Margin dalam mm: [Top, Left, Bottom, Right]
        filename:     currentFileName,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { 
          scale: 2, 
          useCORS: true, 
          logging: false,
          scrollY: 0 // Menghindari offset akibat scroll posisi
        },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { 
          mode: ['css', 'legacy'], 
          avoid: ['tr', 'table', 'h1', 'h2', 'h3', '.box-warning', '.box-recommendation', 'ul', 'ol'] 
        }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }).catch(err => {
        console.error('Gagal mengonversi PDF:', err);
        alert('Terjadi kesalahan saat mengonversi file ke PDF.');
        btn.innerHTML = originalText;
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
